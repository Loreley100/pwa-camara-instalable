<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Inspección Visual PWA</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Inspección Visual PWA</h1>

    <button id="btn-instalar" type="button" hidden>Instalar App</button>

    <button id="btn-preparar-camara" type="button">Solicitar Acceso a Cámara</button>

    <section id="aviso-permiso" hidden>
      <p>Esta aplicación requiere acceso a tu cámara únicamente para mostrar una vista previa local en pantalla. Ninguna imagen se envía a servidores externos.</p>
      <p id="texto-lente-inicial">Se solicitará inicialmente la cámara trasera.</p>
      <button id="btn-confirmar-permiso" type="button">Aceptar y Encender Cámara</button>
    </section>

    <video id="visor-camara" autoplay playsinline muted></video>

    <div class="controles">
      <button id="btn-alternar-camara" type="button" disabled>Cambiar Cámara</button>
      <button id="btn-apagar-camara" type="button" disabled>Apagar Cámara</button>
    </div>

    <p id="mensaje-estado">Cámara apagada.</p>
  </main>

  <script src="./app.js"></script>
</body>
</html>
